<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Preview - Home Hero Ajustado</title>
  <style>
    /* VARIABLES (Extraídas del front_color_guide.md) */
    :root {
      --color-bg-primary: #0d0c18;
      --color-bg-secondary: #1a1830;
      --color-bg-tertiary: #141220;
      --color-bg-card: #211f38;
      --color-bg-modal: #252342;
      --color-bg-overlay: rgba(0, 0, 0, 0.72);
      --color-text-primary: #e8e0d0;
      --color-text-secondary: #b8a898;
      --color-text-disabled: #5a5068;
      --color-gold: #c9a84c;
      --color-gold-light: #e8c96a;
      --color-gold-dark: #9a7a30;
      --color-gold-muted: rgba(201, 168, 76, 0.15);
      --color-clan-fury: #c0392b;
      --color-error: #c0392b;
      --color-error-bg: rgba(192, 57, 43, 0.15);
      --color-border-faint: #252342;
    }
    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      overflow-x: hidden;
    }
    
    /* Mock Navbar (para mostrar la superposición) */
    .mock-navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 72px; /* Según el CSS móvil, la navbar mide 72px */
      background: rgba(13, 12, 24, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--color-border-faint);
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 24px;
      color: var(--color-gold);
      font-weight: bold;
      letter-spacing: 1px;
    }

      /* HERO SECTION
       Cambio solicitado: "quiero q la imagen se pueda ver entera, no que quites la imagen"
       Se restaura la imagen original y se añade margen para que empiece debajo de la navbar.
    */
    .hero-section {
      position: relative;
      height: calc(100vh - 72px); /* Ajustado para compensar el navbar */
      margin-top: 72px;           /* Empieza justo debajo del navbar para que no se superpongan */
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      
      background: 
        radial-gradient(circle at center, var(--color-gold-muted) 0%, transparent 70%),
        linear-gradient(to bottom, var(--color-bg-overlay), var(--color-bg-primary)),
        url('../../front/public/viking_hero.png') no-repeat center top; 
      
      background-size: cover;
      z-index: 2;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 1000px;
      padding: 0 24px;
    }
    .hero-title {
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 900;
      color: var(--color-gold);
      margin: 20px 0;
      letter-spacing: 0.15em;
      text-shadow: 0 0 40px var(--color-gold-muted);
    }
    .hero-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.6rem);
      color: var(--color-text-secondary);
      margin-bottom: 50px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .btn-mithic-primary {
      position: relative;
      padding: 18px 48px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--color-clan-fury), var(--color-error));
      color: white;
      border: 1.5px solid var(--color-gold);
      box-shadow: 0 10px 30px var(--color-error-bg);
      clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
    }
    .scroll-hint {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--color-text-disabled);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
    }
    .arrow-down {
      width: 2px;
      height: 40px;
      background: linear-gradient(to bottom, var(--color-gold), transparent);
    }
  </style>
</head>
<body>
  <!-- PREVIEW ONLY — not production code -->
  
  <div class="mock-navbar">VIKING CLAN WARS - Navbar Falsa (72px)</div>

  <header class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">VIKING CLAN WARS</h1>
      <p class="hero-subtitle">Forge your legacy. Conquer the North.</p>
      
      <div class="hero-actions">
        <button class="btn-mithic-primary">
          <span class="rune">᚛</span> ENTER VALHALLA <span class="rune">᚜</span>
        </button>
      </div>

      <div class="scroll-hint">
        <p>EXPLORE ERA</p>
        <div class="arrow-down"></div>
      </div>
    </div>
  </header>

</body>
</html>
