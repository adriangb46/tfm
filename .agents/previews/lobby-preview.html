<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview - Lobby</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       THEME TOKENS (from front_color_guide.md)
       ========================================================================== */
    :root {
      --color-bg-primary:   #0d0c18;
      --color-bg-secondary: #1a1830;
      --color-bg-tertiary:  #141220;
      --color-bg-card:      #211f38;
      --color-bg-modal:     #252342;
      
      --color-text-primary:   #e8e0d0;
      --color-text-secondary: #b8a898;
      --color-text-inverse:   #0d0c18;
      
      --color-gold:        #c9a84c;
      --color-gold-light:  #e8c96a;
      --color-gold-muted:  rgba(201, 168, 76, 0.15);
      
      --color-border-default: #3a3555;
      
      --color-success:     #2d8a4e;
      --color-success-bg:  rgba(45, 138, 78, 0.15);
      --color-error:       #c0392b;
      --color-error-bg:    rgba(192, 57, 43, 0.15);
      
      --color-clan-fury:   #c0392b;
      --color-clan-divine: #4a90d9;
      
      --color-bg-glass:      rgba(33, 31, 56, 0.7);
    }

    /* ==========================================================================
       BASE STYLES
       ========================================================================== */
    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: 'Outfit', sans-serif;
      /* Simular altura con navbar (fijo sin scroll general) */
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Simulación del navbar */
    .mock-navbar {
      height: 74px;
      background: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border-default);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--color-gold);
      flex-shrink: 0;
    }

    /* ==========================================================================
       LOBBY CONTAINER
       ========================================================================== */
    .lobby-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 2rem;
      gap: 2rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* HERO SECTION */
    .hero-section {
      background: var(--color-bg-glass);
      border: 1px solid var(--color-border-default);
      border-radius: 12px;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .hero-welcome h2 {
      margin: 0;
      font-family: 'Cinzel', serif;
      color: var(--color-gold);
      font-size: 1.8rem;
    }
    
    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* TABS PANEL */
    .tabs-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      background: var(--color-bg-glass);
      border: 1px solid var(--color-border-default);
      border-radius: 12px;
      overflow: hidden;
    }

    .tabs-header {
      display: flex;
      border-bottom: 1px solid var(--color-border-default);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 1rem 1.5rem;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      position: relative;
      transition: color 0.25s;
    }

    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--color-gold);
      transform: scaleX(0);
      transition: transform 0.25s;
    }

    .tab-btn.active {
      color: var(--color-gold);
    }

    .tab-btn.active::after {
      transform: scaleX(1);
    }

    .tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-gold-muted);
      border: 1px solid var(--color-border-default);
      border-radius: 20px;
      padding: 0.1rem 0.55rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-text-secondary);
    }

    .tab-btn.active .tab-badge--active {
      background: var(--color-success-bg);
      border-color: var(--color-success);
      color: var(--color-success);
    }

    .tabs-content {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: auto;
    }

    .tab-pane {
      padding: 1.5rem;
      display: none;
    }
    
    .tab-pane.active {
      display: block;
    }

    /* CARDS */
    .card {
      background: var(--color-bg-card);
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
      margin-bottom: 0.85rem;
      border: 1px solid var(--color-border-default);
    }

    .card:last-child {
      margin-bottom: 0;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1rem;
      color: var(--color-text-primary);
    }

    .clan-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .card-meta {
      font-size: 0.82rem;
      color: var(--color-text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .card-meta strong {
      color: var(--color-text-primary);
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .card-code {
      font-family: monospace;
      background: var(--color-bg-tertiary);
      border-radius: 4px;
      padding: 0.2rem 0.5rem;
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      letter-spacing: 1px;
    }

    .result-badge {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .result-victory { background: var(--color-success-bg); color: var(--color-success); border: 1px solid var(--color-success); }
    .result-defeat { background: var(--color-error-bg); color: var(--color-error); border: 1px solid var(--color-error); }

    /* BUTTONS */
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 0.85rem;
      font-family: 'Outfit', sans-serif;
      text-transform: uppercase;
    }
    .btn-gold { background: var(--color-gold); color: var(--color-text-inverse); }
    .btn-outline { background: transparent; border: 1px solid var(--color-gold); color: var(--color-gold); }
    .btn-danger { background: transparent; border: 1px solid var(--color-error); color: var(--color-error); }
    .btn-ghost { background: var(--color-bg-tertiary); color: var(--color-text-secondary); }
    .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.78rem; }

    /* ==========================================================================
       RESPONSIVE DESIGN (MOBILE FOCUS)
       ========================================================================== */
    @media (max-width: 768px) {
      .mock-navbar {
        padding: 0 1rem;
        justify-content: center;
      }

      .lobby-container {
        padding: 1rem;
        gap: 1.5rem;
      }

      /* Hero Section: Centered and stacked */
      .hero-section {
        flex-direction: column;
        gap: 1.5rem;
        text-align: center;
        padding: 1.5rem 1rem;
      }

      .hero-welcome h2 {
        font-size: 1.4rem;
      }

      .hero-actions {
        flex-direction: column;
        width: 100%;
      }

      .hero-actions .btn {
        width: 100%; /* Botones a ancho completo en móvil */
        padding: 0.8rem; /* Un poco más altos para tocarlos fácil */
      }

      /* Tabs Panel */
      .tab-btn {
        padding: 0.8rem 0.5rem;
        font-size: 0.8rem;
        letter-spacing: 0.5px;
        flex-direction: column; /* Apilar texto y badge */
        gap: 0.3rem;
      }

      .tab-pane {
        padding: 1rem;
      }

      /* Cards: Adaptaciones para móvil */
      .card-top {
        flex-direction: column;
        align-items: stretch; /* Ocupar todo el ancho */
        gap: 0.8rem;
      }

      .card-title {
        font-size: 1.1rem;
        justify-content: center; /* Centrar el título de la partida si se desea, o dejar izq */
      }

      .card-actions {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr; /* Dos botones lado a lado, o 1fr para apilarlos */
        gap: 0.5rem;
      }
      
      .card-actions .btn {
        width: 100%;
        text-align: center;
      }

      .card-meta {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
        margin-top: 0.5rem;
        padding-top: 0.5rem;
        border-top: 1px dashed var(--color-border-default);
      }
      
      .card-meta > span {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <div class="mock-navbar">
    VIKING CLAN WARS (MOCK)
  </div>

  <div class="lobby-container">
    
    <!-- Hero Section -->
    <section class="hero-section">
      <div class="hero-welcome">
        <h2>LOBBY</h2>
      </div>
      <div class="hero-actions">
        <button class="btn btn-gold">NUEVA PARTIDA</button>
        <button class="btn btn-outline">UNIRSE A PARTIDA</button>
      </div>
    </section>

    <!-- Tabs Panel -->
    <div class="tabs-panel">
      <!-- Tabs Header -->
      <div class="tabs-header">
        <button class="tab-btn active">
          ACTIVAS
          <span class="tab-badge tab-badge--active">2</span>
        </button>
        <button class="tab-btn">
          TERMINADAS
          <span class="tab-badge">1</span>
        </button>
      </div>

      <!-- Tabs Content -->
      <div class="tabs-content">
        <!-- Active Games -->
        <div class="tab-pane active">
          
          <div class="card">
            <div class="card-top">
              <span class="card-title">
                <span class="clan-dot" style="background: var(--color-clan-fury)"></span>
                La Ira de Odín
              </span>
              <div class="card-actions">
                <button class="btn btn-gold btn-sm">ENTRAR</button>
                <button class="btn btn-danger btn-sm">ABANDONAR</button>
              </div>
            </div>
            <div class="card-meta">
              <span>Clan: <strong>Berserkers</strong></span>
              <span class="card-code">ABC-123</span>
            </div>
          </div>

          <div class="card">
            <div class="card-top">
              <span class="card-title">
                <span class="clan-dot" style="background: var(--color-clan-divine)"></span>
                Defensa del Norte
              </span>
              <div class="card-actions">
                <button class="btn btn-gold btn-sm">ENTRAR</button>
                <button class="btn btn-danger btn-sm">ABANDONAR</button>
              </div>
            </div>
            <div class="card-meta">
              <span>Clan: <strong>Valkirias</strong></span>
              <span class="card-code">XYZ-987</span>
            </div>
          </div>

          <div class="card">
            <div class="card-top">
              <span class="card-title">
                <span class="clan-dot" style="background: var(--color-success)"></span>
                Bosque de los Sabios
              </span>
              <div class="card-actions">
                <button class="btn btn-gold btn-sm">ENTRAR</button>
                <button class="btn btn-danger btn-sm">ABANDONAR</button>
              </div>
            </div>
            <div class="card-meta">
              <span>Clan: <strong>Seidr</strong></span>
              <span class="card-code">AAA-111</span>
            </div>
          </div>

          <div class="card">
            <div class="card-top">
              <span class="card-title">
                <span class="clan-dot" style="background: var(--color-clan-fury)"></span>
                El Asedio
              </span>
              <div class="card-actions">
                <button class="btn btn-gold btn-sm">ENTRAR</button>
                <button class="btn btn-danger btn-sm">ABANDONAR</button>
              </div>
            </div>
            <div class="card-meta">
              <span>Clan: <strong>Berserkers</strong></span>
              <span class="card-code">BBB-222</span>
            </div>
          </div>

          <div class="card">
            <div class="card-top">
              <span class="card-title">
                <span class="clan-dot" style="background: var(--color-gold)"></span>
                La Última Frontera
              </span>
              <div class="card-actions">
                <button class="btn btn-gold btn-sm">ENTRAR</button>
                <button class="btn btn-danger btn-sm">ABANDONAR</button>
              </div>
            </div>
            <div class="card-meta">
              <span>Clan: <strong>Jarls</strong></span>
              <span class="card-code">CCC-333</span>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- Script to toggle tabs for preview interactivity -->
  <script>
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        // Simple mock toggle
        if (tab.innerText.includes('TERMINADAS')) {
          document.querySelector('.tab-pane').innerHTML = `
            <div class="card">
              <div class="card-top">
                <span class="card-title">Guerra Pasada</span>
                <div class="card-actions">
                  <button class="btn btn-ghost btn-sm">ESTADÍSTICAS</button>
                  <button class="btn btn-danger btn-sm">BORRAR</button>
                </div>
              </div>
              <div class="card-meta">
                <span class="result-badge result-victory">VICTORIA</span>
                <span class="card-code">OLD-555</span>
              </div>
            </div>
          `;
        } else {
          location.reload(); // Quick reset for preview purposes
        }
      });
    });
  </script>
</body>
</html>
